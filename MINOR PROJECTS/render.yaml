services:
  - type: web
    name: stocks-api
    runtime: python
    region: oregon
    plan: free
    rootDir: MINOR PROJECTS
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stocks-db
          property: connectionString

  - type: web
    name: stocks-dashboard
    runtime: python
    region: oregon
    plan: free
    rootDir: MINOR PROJECTS
    buildCommand: pip install -r dashboard/requirements.txt
    startCommand: streamlit run dashboard/streamlit_app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: API_URL
        value: http://localhost:8000

databases:
  - name: stocks-db
    databaseName: stockdb
    user: stockuser
    plan: free
    region: oregon
    ipAllowList: []
